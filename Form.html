<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Student Registration Form</title>
    <link href="styles.css" rel="stylesheet">
</head>

<body>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>

<div class="container">
    <div class="greeting" id="greeting"></div>
    <div class="success-message" id="successMessage"></div>

    <h2>Student Registration Form</h2>

    <div class="form-container">
        <form id="student-form">
            <div class="form-group">
                <label for="first-name">First Name</label>
                <input id="first-name" name="first-name" required type="text">
            </div>

            <div class="form-group">
                <label for="last-name">Last Name</label>
                <input id="last-name" name="last-name" required type="text">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input id="email" name="email" required type="email">
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input id="dob" name="dob" required type="date">
            </div>

            <div class="form-group">
                <div class="section-title">Gender</div>
                <div class="gender-residential">
                    <div class="option-card">
                        <label for="male">
                            <input id="male" name="gender" required type="radio" value="male">
                            Male
                        </label>
                    </div>
                    <div class="option-card">
                        <label for="female">
                            <input id="female" name="gender" required type="radio" value="female">
                            Female
                        </label>
                    </div>
                    <div class="option-card">
                        <label for="other">
                            <input id="other" name="gender" required type="radio" value="other">
                            Other
                        </label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <div class="section-title">Residential Type</div>
                <div class="gender-residential">
                    <div class="option-card">
                        <label for="day-scholar">
                            <input id="day-scholar" name="residential-type" type="checkbox" value="day-scholar">
                            Day Scholar
                        </label>
                    </div>
                    <div class="option-card">
                        <label for="hosteller">
                            <input id="hosteller" name="residential-type" type="checkbox" value="hosteller">
                            Hosteller
                        </label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="course">Select Course</label>
                <select id="course" name="course" required>
                    <option value="Select">Select</option>
                    <option value="computer-science">Computer Science</option>
                    <option value="Electrical">Electrical</option>
                    <option value="Mechanical">Mechanical</option>
                    <option value="Civil">Civil</option>
                </select>
            </div>

            <input class="submit-btn" onclick="validateAndSubmit()" type="button" value="Submit Application">
        </form>
    </div>

    <div class="footer-links">
        <ul>
            <li><a href="about.html">About Us</a></li>
            <li><a href="contact.html">Contact Us</a></li>
            <li><a href="service.html">Our Services</a></li>
        </ul>
    </div>
</div>
<script src="form.js"></script>
</body>

</html>
